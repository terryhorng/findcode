<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泰瑞倉頡－線上查碼</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Noto Sans CJK TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(37 99 235 / 0.15);
    }

    button {
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: var(--muted);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .char-display {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 1.25rem;
      line-height: 1.2;
    }

    .code-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .code-item {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
    }

    .label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .value {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .value.cangjie {
      font-size: 1.35rem;
      letter-spacing: 0.15em;
    }

    .not-found {
      text-align: center;
      color: #dc2626;
      padding: 1rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>泰瑞倉頡－線上查碼</h1>
  <p class="subtitle">支援 CJK URO + Extension A～J 漢字及部分符號</p>

  <div class="card">
    <div class="input-group">
      <input type="text" id="charInput" placeholder="請輸入單一漢字" autocomplete="off">
      <button id="searchBtn" disabled>查碼</button>
    </div>

    <div id="status" class="status">正在載入碼表，請稍待15秒左右...</div>

    <div id="result" class="result">
      <div class="char-display" id="charDisplay"></div>
      <div class="code-list" id="codeList"></div>
    </div>
  </div>

  <footer>資料來源：<a href="https://terryjiun.github.io/posts/Terry-Yong-CJK-Extension-I/" target="_blank">泰瑞版小小輸入法</a>（最新版泰瑞倉頡碼表）</footer>

  <script>
    // 倉頡字母對照表
    const radicalMap = {
      a: "日", b: "月", c: "金", d: "木", e: "水",
      f: "火", g: "土", h: "竹", i: "戈", j: "十",
      k: "大", l: "中", m: "一", n: "弓", o: "人",
      p: "心", q: "手", r: "口", s: "尸", t: "廿",
      u: "山", v: "女", w: "田", x: "難", y: "卜",
      z: "重"
    };

    // 字元 → 編碼陣列
    let codeMap = new Map();

    // 把英文字母編碼轉成倉頡字母
    function toCangjie(code) {
      return code
        .toLowerCase()
        .split("")
        .map(c => radicalMap[c] || c)
        .join("");
    }

    // 正確取出「一個 Unicode 字元」（支援代理對-Surrogate Pair）
    function getFirstChar(str) {
      const chars = [...str];          // 正確處理 surrogate pair
      return chars.length > 0 ? chars[0] : "";
    }

    // 載入並解析 Chajei.txt
    async function loadCodeTable() {
      try {
        const response = await fetch("./Chajei.txt");
        if (!response.ok) throw new Error("無法載入 Chajei.txt");

        const text = await response.text();
        const lines = text.split(/\r?\n/);

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith("##")) continue;

          const parts = trimmed.split(/\s+/);
          if (parts.length < 2) continue;

          const code = parts[0].toLowerCase();
          const char = parts[1];

          if (!codeMap.has(char)) {
            codeMap.set(char, []);
          }
          if (!codeMap.get(char).includes(code)) {
            codeMap.get(char).push(code);
          }
        }

        document.getElementById("status").textContent = `碼表載入完成（共 ${codeMap.size} 個字）`;
        document.getElementById("searchBtn").disabled = false;
      } catch (err) {
        document.getElementById("status").textContent = "載入碼表失敗：" + err.message;
        console.error(err);
      }
    }

    // 執行查詢
    function search() {
      const input = document.getElementById("charInput");
      const raw = input.value.trim();
      const char = getFirstChar(raw);   // 正確取得單一 Unicode 字元

      const resultEl = document.getElementById("result");
      const charDisplay = document.getElementById("charDisplay");
      const codeList = document.getElementById("codeList");
      const status = document.getElementById("status");

      codeList.innerHTML = "";
      resultEl.classList.remove("show");

      if (!char) {
        status.textContent = "請輸入一個漢字";
        return;
      }

      // 如果使用者貼了多個字，提醒並只用第一個
      if ([...raw].length > 1) {
        status.textContent = `偵測到多個字，已使用第一個字「${char}」查詢`;
      }

      const codes = codeMap.get(char);

      if (!codes || codes.length === 0) {
        status.textContent = status.textContent.includes("偵測到") ? status.textContent : "";
        charDisplay.textContent = char;
        codeList.innerHTML = `<div class="not-found">查無此字的倉頡編碼</div>`;
        resultEl.classList.add("show");
        return;
      }

      if (!status.textContent.includes("偵測到")) {
        status.textContent = `找到 ${codes.length} 組編碼`;
      } else {
        status.textContent += `，找到 ${codes.length} 組編碼`;
      }

      charDisplay.textContent = char;

      // 依編碼長度排序
      codes.sort((a, b) => a.length - b.length || a.localeCompare(b));

      for (const code of codes) {
        const item = document.createElement("div");
        item.className = "code-item";
        item.innerHTML = `
          <div>
            <div class="label">英文字母</div>
            <div class="value">${code.toUpperCase()}</div>
          </div>
          <div>
            <div class="label">倉頡字母</div>
            <div class="value cangjie">${toCangjie(code)}</div>
          </div>
        `;
        codeList.appendChild(item);
      }

      resultEl.classList.add("show");
    }

    // 事件綁定
    document.getElementById("searchBtn").addEventListener("click", search);

    document.getElementById("charInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        search();
      }
    });

    // 輸入時自動只保留最後一個完整的 Unicode 字元
    document.getElementById("charInput").addEventListener("input", (e) => {
      const chars = [...e.target.value];
      if (chars.length > 1) {
        // 只保留最後一個字（支援 Ext-A～J）
        e.target.value = chars[chars.length - 1];
      }
    });

    // 頁面載入時讀取碼表
    loadCodeTable();
  </script>
</body>
</html>
